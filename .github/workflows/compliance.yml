name: compliance

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt

      # The hardened sample must stay compliant. If a change to a check or to the
      # parser breaks it, the build fails here rather than in production.
      - name: Hardened baseline must pass
        run: |
          python -m netcompliance \
            --config samples/hardened-router.cfg \
            --benchmark checks/*.yaml \
            --fail-on low

      # The non-compliant sample must keep failing. A tool that stops finding known
      # problems is broken in the most dangerous way: silently.
      - name: Non-compliant sample must still be caught
        run: |
          if python -m netcompliance \
               --config samples/non-compliant-router.cfg \
               --benchmark checks/*.yaml \
               --fail-on high > /dev/null; then
            echo "::error::the non-compliant sample passed - the tool is broken"
            exit 1
          fi
          echo "known-bad config correctly rejected"

      - name: Publish the report
        if: always()
        run: |
          python -m netcompliance \
            --config samples/*.cfg \
            --benchmark checks/*.yaml \
            --format markdown --output report.md --fail-on never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-report
          path: report.md
