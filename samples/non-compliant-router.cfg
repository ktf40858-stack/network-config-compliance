! =====================================================================
! SYNTHETIC SAMPLE - deliberately non-compliant, for testing the tool.
! Not a real device. Every credential below is the literal string
! EXAMPLE-NOT-A-REAL-SECRET and every address is RFC 5737 / RFC 1918.
! Do not copy any of this into a real configuration.
! =====================================================================
!
version 15.7
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
!
hostname LAB-RTR-BAD
!
boot-start-marker
boot-end-marker
!
enable password EXAMPLE-NOT-A-REAL-SECRET
!
username admin privilege 15 password EXAMPLE-NOT-A-REAL-SECRET
username operator password EXAMPLE-NOT-A-REAL-SECRET
!
no aaa new-model
!
ip source-route
ip http server
ip http secure-server
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 203.0.113.2 255.255.255.252
 ip proxy-arp
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description LAN core
 ip address 192.168.10.1 255.255.255.0
 ip proxy-arp
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description DMZ
 ip address 192.168.20.1 255.255.255.0
 ip proxy-arp
 shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 203.0.113.0 0.0.0.3 area 0
!
ip forward-protocol nd
!
snmp-server community public RO
snmp-server community private RW
!
logging buffered 4096
!
ntp server 198.51.100.10
!
line con 0
 password EXAMPLE-NOT-A-REAL-SECRET
 login
!
line aux 0
 password EXAMPLE-NOT-A-REAL-SECRET
 login
!
line vty 0 4
 password EXAMPLE-NOT-A-REAL-SECRET
 login
 transport input telnet ssh
!
line vty 5 15
 password EXAMPLE-NOT-A-REAL-SECRET
 login
 transport input all
!
end
