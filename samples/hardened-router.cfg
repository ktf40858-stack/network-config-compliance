! =====================================================================
! SYNTHETIC SAMPLE - the remediated version of non-compliant-router.cfg.
! Not a real device. Secrets are shown as <PLACEHOLDER> and are not
! valid values; addresses are RFC 5737 / RFC 1918.
! =====================================================================
!
version 15.7
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname LAB-RTR-GOOD
!
boot-start-marker
boot-end-marker
!
enable secret <ENABLE_SECRET_HASH>
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authentication enable default group tacacs+ enable
aaa authorization exec default group tacacs+ local
aaa authorization commands 15 default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
aaa accounting commands 15 default start-stop group tacacs+
!
username emergency privilege 15 secret <LOCAL_SECRET_HASH>
!
no ip source-route
no ip bootp server
no ip http server
no ip http secure-server
no ip domain-lookup
ip domain-name lab.example.net
!
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
ip ssh server algorithm mac hmac-sha2-256 hmac-sha2-512
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 203.0.113.2 255.255.255.252
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <OSPF_KEY>
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description LAN core
 ip address 192.168.10.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <OSPF_KEY>
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description DMZ
 ip address 192.168.20.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <OSPF_KEY>
 shutdown
!
router ospf 1
 router-id 1.1.1.1
 area 0 authentication message-digest
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 203.0.113.0 0.0.0.3 area 0
!
ip forward-protocol nd
!
ip access-list standard MGMT-ACCESS
 permit 192.168.10.0 0.0.0.255
 deny   any log
!
snmp-server group NETMON v3 priv read SNMP-RO access MGMT-ACCESS
snmp-server user netmon NETMON v3 auth sha <AUTH_KEY> priv aes 128 <PRIV_KEY>
!
logging buffered 65536 informational
logging host 192.168.10.50
logging trap informational
logging source-interface GigabitEthernet0/1
!
ntp authenticate
ntp authentication-key 1 md5 <NTP_KEY>
ntp trusted-key 1
ntp server 198.51.100.10 key 1
!
banner login ^C
*** Authorised access only. This system is monitored and all activity recorded. ***
*** Disconnect immediately if you are not an authorised user. ***
^C
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login authentication default
!
line aux 0
 no exec
 transport input none
!
line vty 0 15
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 logging synchronous
 login authentication default
 transport input ssh
 transport output ssh
!
end
